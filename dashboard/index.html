<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>CouncilAI — Review Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --bg: #0b0d10; --surface: #14171c; --surface-2: #1b1f26; --border: #262b33;
    --text: #e8eaed; --text-dim: #9aa3af; --accent: #6ea8fe;
    --green: #3ecf8e; --red: #ff5c5c; --amber: #f5b342; --purple: #b389f9;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 80px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--text-dim); font-size: 13px; margin-bottom: 24px; }
  .demo-row { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
  .demo-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 10px 14px; border-radius: 10px; font-size: 13px; cursor: pointer; transition: border-color .15s;
  }
  .demo-btn:hover { border-color: var(--accent); }
  .demo-btn:disabled { opacity: .5; cursor: default; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; }
  .verdict-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .verdict-badge { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
  .agreement { font-size: 12px; color: var(--text-dim); margin-bottom: 14px; }
  .agent-row { display: grid; grid-template-columns: 110px 1fr 60px; align-items: center; gap: 10px; margin-bottom: 10px; }
  .agent-name { font-size: 13px; }
  .bar-track { background: var(--surface-2); border-radius: 6px; height: 10px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; }
  .conf-val { font-size: 12px; color: var(--text-dim); text-align: right; }
  .trace-toggle { cursor: pointer; color: var(--accent); font-size: 13px; margin-top: 10px; user-select: none; }
  .trace-box {
    margin-top: 10px; background: #0e1013; border: 1px solid var(--border); border-radius: 10px; padding: 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.6; white-space: pre-wrap;
    color: #c9d1d9;
  }
  .trace-box .num { color: var(--accent); }
  .timeline { display: flex; flex-direction: column; gap: 8px; }
  .tl-item { display: flex; gap: 10px; font-size: 12px; align-items: baseline; }
  .tl-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; margin-top: 4px; }
  .tl-step { color: var(--text); }
  .tl-ts { color: var(--text-dim); }
  .empty { color: var(--text-dim); font-size: 13px; padding: 40px 0; text-align: center; }
  .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim); margin-bottom: 12px; }
  .reviews-list { display: flex; flex-direction: column; gap: 6px; }
  .review-item {
    display: flex; justify-content: space-between; padding: 8px 10px; border-radius: 8px; cursor: pointer;
    font-size: 13px; border: 1px solid transparent;
  }
  .review-item:hover { border-color: var(--border); }
  .review-item.selected { background: var(--surface-2); border-color: var(--accent); }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;
const API = ""; // same-origin; FastAPI serves this file

const DECISION_COLOR = {
  APPROVE: "var(--green)", REJECT: "var(--red)", WARN: "var(--amber)",
  REQUEST_CHANGES: "#ff9f40", ESCALATE_TO_HUMAN: "var(--purple)",
};

function Badge({ decision }) {
  const color = DECISION_COLOR[decision] || "var(--text-dim)";
  return (
    <span className="verdict-badge" style={{ background: color + "22", color, border: `1px solid ${color}55` }}>
      {decision || "PENDING"}
    </span>
  );
}

function AgentBar({ op }) {
  const color = DECISION_COLOR[op.decision] || "var(--accent)";
  const conf = op.adjusted_confidence != null ? op.adjusted_confidence : op.confidence;
  return (
    <div className="agent-row">
      <div className="agent-name">{op.agent_name}{op.is_timeout ? " ⏱" : ""}</div>
      <div className="bar-track"><div className="bar-fill" style={{ width: `${Math.round((conf||0)*100)}%`, background: color }} /></div>
      <div className="conf-val">{conf != null ? conf.toFixed(2) : "—"}</div>
    </div>
  );
}

function agreementLabel(opinions) {
  if (!opinions.length) return "";
  const counts = {};
  opinions.forEach(o => { counts[o.decision] = (counts[o.decision]||0)+1; });
  const entries = Object.entries(counts).sort((a,b) => b[1]-a[1]);
  if (entries.length === 1) return `${opinions.length} of ${opinions.length} agents agree — ${entries[0][0]}`;
  if (entries.length === 2 && entries[0][1] === entries[1][1]) {
    return `Split verdict: ${entries[0][1]} ${entries[0][0]} vs ${entries[1][1]} ${entries[1][0]}`;
  }
  return `${entries[0][1]} of ${opinions.length} agents lean ${entries[0][0]}`;
}

function ReasoningTrace({ verdict, opinions }) {
  const [open, setOpen] = useState(false);
  return (
    <div>
      <div className="trace-toggle" onClick={() => setOpen(!open)}>
        {open ? "▾ Hide reasoning trace" : "▸ Show reasoning trace"}
      </div>
      {open && (
        <div className="trace-box">
          {`Weighted score: `}<span className="num">{verdict?.weighted_score ?? "—"}</span>{`\n`}
          {`Final confidence: `}<span className="num">{verdict?.confidence ?? "—"}</span>{`\n\n`}
          {opinions.map(o => (
            `${o.agent_name}: ${o.decision} (raw ${o.confidence?.toFixed?.(2)} -> adj ${(o.adjusted_confidence ?? o.confidence)?.toFixed?.(2)})\n`
          )).join("")}
        </div>
      )}
    </div>
  );
}

function Timeline({ entries }) {
  if (!entries.length) return null;
  return (
    <div className="card">
      <div className="section-title">Pipeline timeline</div>
      <div className="timeline">
        {entries.map((e, i) => (
          <div className="tl-item" key={i}>
            <div className="tl-dot" />
            <div className="tl-step">{e.step.replaceAll("_", " ")}</div>
            <div className="tl-ts">{new Date(e.ts).toLocaleTimeString()}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function ReviewDetail({ reviewId }) {
  const [data, setData] = useState(null);
  const timer = useRef(null);

  const fetchReview = useCallback(async () => {
    if (!reviewId) return;
    const res = await fetch(`${API}/review/${reviewId}`);
    if (res.ok) setData(await res.json());
  }, [reviewId]);

  useEffect(() => {
    setData(null);
    fetchReview();
    timer.current = setInterval(fetchReview, 5000); // live polling, no reload
    return () => clearInterval(timer.current);
  }, [reviewId, fetchReview]);

  if (!reviewId) return <div className="empty">Trigger a demo PR, or pick a review from the list, to see its verdict here.</div>;
  if (!data) return <div className="empty">Loading review #{reviewId}…</div>;

  const { review, opinions, verdict } = data;

  return (
    <div>
      <div className="card">
        <div className="verdict-head">
          <Badge decision={verdict?.decision} />
          <span style={{ fontSize: 13, color: "var(--text-dim)" }}>
            {review.repo}#{review.pr_number} · {review.pr_title}
          </span>
        </div>
        <div className="agreement">{agreementLabel(opinions)} · status: {review.status}</div>
        {opinions.map(op => <AgentBar key={op.id} op={op} />)}
        <ReasoningTrace verdict={verdict} opinions={opinions} />
      </div>
      <Timeline entries={data.audit_trail || []} />
    </div>
  );
}

function App() {
  const [reviews, setReviews] = useState([]);
  const [selected, setSelected] = useState(null);
  const [triggering, setTriggering] = useState(null);

  const DEMOS = [
    { n: 1, label: "PR #1 — Clean approve" },
    { n: 2, label: "PR #2 — Security vs Architecture conflict" },
    { n: 3, label: "PR #3 — Schema migration (escalate)" },
  ];

  const fetchReviews = useCallback(async () => {
    const res = await fetch(`${API}/reviews`);
    if (res.ok) {
      const d = await res.json();
      setReviews(d.reviews);
    }
  }, []);

  useEffect(() => {
    fetchReviews();
    const t = setInterval(fetchReviews, 6000);
    return () => clearInterval(t);
  }, [fetchReviews]);

  const trigger = async (n) => {
    setTriggering(n);
    try {
      const res = await fetch(`${API}/demo/trigger/${n}`, { method: "POST" });
      const d = await res.json();
      await fetchReviews();
      if (d.review_id) setSelected(d.review_id);
    } finally {
      setTriggering(null);
    }
  };

  return (
    <div className="wrap">
      <h1>CouncilAI</h1>
      <div className="sub">Evidence-weighted multi-agent code review — live dashboard</div>

      <div className="demo-row">
        {DEMOS.map(d => (
          <button key={d.n} className="demo-btn" disabled={triggering !== null} onClick={() => trigger(d.n)}>
            {triggering === d.n ? "Running…" : d.label}
          </button>
        ))}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "260px 1fr", gap: 20 }}>
        <div className="card">
          <div className="section-title">Recent reviews</div>
          <div className="reviews-list">
            {reviews.length === 0 && <div className="empty">No reviews yet.</div>}
            {reviews.map(r => (
              <div
                key={r.id}
                className={"review-item" + (selected === r.id ? " selected" : "")}
                onClick={() => setSelected(r.id)}
              >
                <span>#{r.id} {r.repo.split("/").pop()}</span>
                <span className="pill" style={{ color: "var(--text-dim)" }}>{r.status}</span>
              </div>
            ))}
          </div>
        </div>
        <ReviewDetail reviewId={selected} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
